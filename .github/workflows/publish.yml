name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already merged into main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const version = require("./package.json").version; if (version !== process.env.EXPECTED_VERSION) throw new Error(`Expected ${process.env.EXPECTED_VERSION}, got ${version}`)'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:release-commit
      - run: npm publish --provenance
